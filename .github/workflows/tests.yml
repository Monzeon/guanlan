name: tests

# 远端 CI 只跑 Windows：应用依赖 Win32 / ctypes / pywebview，Linux 上跑不起来。
# 本地每次提交的实际门禁是 .githooks/pre-commit（见 docs/回归门禁.md）。
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python: ["3.11", "3.13"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 跑回归集
        run: python -m unittest discover -s tests -v
